
<!DOCTYPE html>

    <title>Gallery - Snow Trails Agency</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .gallery-heading {
            text-align: center;
            color: #163d63;
            margin: 30px 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .gallery a {
            display: block;
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
